<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Frame Cleaner</title>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      margin: 0;
      padding: 16px;
      background: #ffffff;
      color: #000000;
      overflow: hidden;
    }
    
    .screen {
      display: none;
      animation: fadeIn 0.3s ease-in;
    }
    
    .screen.active {
      display: block;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    /* Common Elements */
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    
    .logo {
      width: 40px;
      height: 40px;
      background: #4F46E5;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 20px;
      font-weight: 700;
      color: white;
    }
    
    /* Initial Screen */
    .placeholder-container {
      text-align: center;
      margin: 24px 0;
    }
    
    .placeholder-image {
      width: 200px;
      height: 120px;
      background: #f1f5f9;
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      color: #64748b;
      font-size: 11px;
    }
    
    .initial-message {
      font-size: 14px;
      color: #334155;
      margin-bottom: 32px;
      font-weight: 500;
    }
    
    .initial-links {
      text-align: center;
      margin-top: 48px;
    }
    
    .link {
      color: #4F46E5;
      text-decoration: none;
      font-size: 11px;
      display: block;
      margin-bottom: 12px;
      cursor: pointer;
    }
    
    .link:hover {
      text-decoration: underline;
    }
    
    /* Analysis Screen */
    .frame-header {
      text-align: center;
      margin-bottom: 24px;
    }
    
    .frame-label {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 4px;
    }
    
    .frame-name {
      font-size: 16px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 24px;
    }
    
    .stats-container {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }
    
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 12px;
    }
    
    .stat-row:last-child {
      margin-bottom: 0;
    }
    
    .stat-label {
      color: #475569;
    }
    
    .stat-value {
      color: #1e293b;
      font-weight: 600;
    }
    
    .removable-container {
      margin-bottom: 24px;
    }
    
    .removable-list {
      max-height: 200px;
      overflow-y: auto;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
    }
    
    .removable-item {
      border-bottom: 1px solid #f1f5f9;
      transition: background-color 0.2s ease;
    }
    
    .removable-item:last-child {
      border-bottom: none;
    }
    
    .removable-item:hover {
      background: #f8fafc;
    }
    
    .removable-header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .removable-title-container {
      flex: 1;
      cursor: pointer;
    }
    
    .removable-title {
      font-size: 12px;
      color: #1e293b;
      font-weight: 500;
    }
    
    .removable-subtitle {
      font-size: 10px;
      color: #64748b;
      margin-top: 2px;
    }

    .removable-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .target-icon {
      width: 16px;
      height: 16px;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .target-icon:hover {
      opacity: 1;
    }

    .target-icon svg {
      width: 14px;
      height: 14px;
    }
    
    .chevron {
      font-size: 12px;
      color: #64748b;
      transition: transform 0.2s ease;
      cursor: pointer;
    }
    
    .chevron.expanded {
      transform: rotate(180deg);
    }
    
    .inheritance-details {
      padding: 0 16px 12px 16px;
      background: #f8fafc;
      border-top: 1px solid #f1f5f9;
      display: none;
    }
    
    .inheritance-details.expanded {
      display: block;
    }
    
    .inheritance-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      font-size: 11px;
    }
    
    .inheritance-label {
      color: #64748b;
    }
    
    .inheritance-value {
      color: #1e293b;
      text-align: right;
      max-width: 150px;
      word-break: break-word;
    }
    
    /* Button */
    .button {
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      border: none;
      width: 100%;
      background: #4F46E5;
      color: #ffffff;
    }
    
    .button:hover:not(:disabled) {
      background: #4338CA;
    }
    
    .button:disabled {
      background: #f5f5f5;
      color: #999999;
      cursor: not-allowed;
    }
    
    /* Optimized Screen */
    .optimized-container {
      text-align: center;
      margin: 48px 0;
    }
    
    .optimized-message {
      font-size: 14px;
      color: #059669;
      font-weight: 500;
      margin-bottom: 8px;
    }
    
    .optimized-subtitle {
      font-size: 12px;
      color: #64748b;
    }
    
    /* Loading state */
    .analyzing {
      opacity: 0.6;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- Initial Screen -->
  <div id="initial-screen" class="screen active">
    <div class="header">
      <div class="logo">F</div>
    </div>

    <div class="placeholder-container">
      <div class="placeholder-image">
        [Placeholder for GIF/Image]
      </div>
      <div class="initial-message">Select a frame to get started</div>
    </div>

    <div class="initial-links">
      <a href="#" class="link" id="know-more">Know more</a>
      <a href="#" class="link" id="report-bug">Report a bug</a>
    </div>
  </div>

  <!-- Analysis Screen -->
  <div id="analysis-screen" class="screen">
    <div class="header">
      <div class="logo">F</div>
    </div>

    <div class="frame-header">
      <div class="frame-label">Frame</div>
      <div class="frame-name" id="frame-name">Loading...</div>
    </div>

    <div class="stats-container">
      <div class="stat-row">
        <span class="stat-label">Total Frames</span>
        <span class="stat-value" id="total-frames">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Removable Frames</span>
        <span class="stat-value" id="removable-frames">0</span>
      </div>
    </div>

    <div class="removable-container" id="removable-container">
      <div class="removable-list" id="removable-list">
        <!-- Removable items will be populated here -->
      </div>
    </div>

    <button id="optimize-btn" class="button">Optimize</button>
  </div>

  <!-- Optimized Screen -->
  <div id="optimized-screen" class="screen">
    <div class="header">
      <div class="logo">F</div>
    </div>

    <div class="frame-header">
      <div class="frame-label">Frame</div>
      <div class="frame-name" id="optimized-frame-name">Loading...</div>
    </div>

    <div class="stats-container">
      <div class="stat-row">
        <span class="stat-label">Total Frames</span>
        <span class="stat-value" id="optimized-total-frames">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Removable Frames</span>
        <span class="stat-value">0</span>
      </div>
    </div>

    <div class="optimized-container">
      <div class="optimized-message">Frame is optimized</div>
      <div class="optimized-subtitle">Select another frame to continue</div>
    </div>
  </div>

  <script>
    // State management
    let currentScreen = 'initial';
    let analysisData = null;

    // Screen management
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(screen => {
        screen.classList.remove('active');
      });
      document.getElementById(screenId + '-screen').classList.add('active');
      currentScreen = screenId;
    }

    // Format inheritance value for display
    function formatInheritanceValue(key, value) {
      if (!value || value === '' || value === '0' || value === 'NONE') {
        return '—';
      }
      
      switch (key) {
        case 'children':
          return `${value} children`;
        case 'padding':
          return value;
        case 'alignment':
          return value;
        case 'sizingMode':
          return value;
        case 'itemSpacing':
          return value;
        case 'layoutMode':
          return value;
        default:
          return value;
      }
    }

    // Create removable item HTML
    function createRemovableItem(frameInfo, index) {
      const item = document.createElement('div');
      item.className = 'removable-item';
      item.dataset.nodeId = frameInfo.nodeId;
      item.dataset.index = index;

      const header = document.createElement('div');
      header.className = 'removable-header';
      
      const titleContainer = document.createElement('div');
      titleContainer.className = 'removable-title-container';
      
      const title = document.createElement('div');
      title.className = 'removable-title';
      title.textContent = frameInfo.name;
      titleContainer.appendChild(title);
      
      const subtitle = document.createElement('div');
      subtitle.className = 'removable-subtitle';
      subtitle.textContent = `To be inherited by ${frameInfo.parentName}`;
      titleContainer.appendChild(subtitle);

      const actions = document.createElement('div');
      actions.className = 'removable-actions';
      
      // Target icon for locate functionality
      const targetIcon = document.createElement('div');
      targetIcon.className = 'target-icon';
      targetIcon.innerHTML = `
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="8" cy="8" r="1.5" fill="currentColor"/>
          <circle cx="8" cy="8" r="4" stroke="currentColor" stroke-width="1" fill="none"/>
          <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1" fill="none"/>
        </svg>
      `;
      
      const chevron = document.createElement('div');
      chevron.className = 'chevron';
      chevron.textContent = '▼';

      actions.appendChild(targetIcon);
      actions.appendChild(chevron);
      
      const details = document.createElement('div');
      details.className = 'inheritance-details';
      
      // Create inheritance detail rows
      const inheritanceKeys = [
        { key: 'children', label: 'Children' },
        { key: 'padding', label: 'Padding' },
        { key: 'alignment', label: 'Alignment' },
        { key: 'sizingMode', label: 'Sizing Mode' },
        { key: 'itemSpacing', label: 'Item Spacing' },
        { key: 'layoutMode', label: 'Layout Mode' }
      ];
      
      inheritanceKeys.forEach(({ key, label }) => {
        const value = frameInfo.inheritance[key];
        if (value && value !== '' && value !== '0' && value !== 'NONE') {
          const row = document.createElement('div');
          row.className = 'inheritance-row';
          
          const labelSpan = document.createElement('span');
          labelSpan.className = 'inheritance-label';
          labelSpan.textContent = label;
          
          const valueSpan = document.createElement('span');
          valueSpan.className = 'inheritance-value';
          valueSpan.textContent = formatInheritanceValue(key, value);
          
          row.appendChild(labelSpan);
          row.appendChild(valueSpan);
          details.appendChild(row);
        }
      });
      
      // Add click handler for chevron expansion
      titleContainer.addEventListener('click', () => {
        const isExpanded = details.classList.contains('expanded');
        
        if (isExpanded) {
          details.classList.remove('expanded');
          chevron.classList.remove('expanded');
        } else {
          details.classList.add('expanded');
          chevron.classList.add('expanded');
        }
      });

      chevron.addEventListener('click', (e) => {
        e.stopPropagation();
        const isExpanded = details.classList.contains('expanded');
        
        if (isExpanded) {
          details.classList.remove('expanded');
          chevron.classList.remove('expanded');
        } else {
          details.classList.add('expanded');
          chevron.classList.add('expanded');
        }
      });

      // Add click handler for target icon (locate frame)
      targetIcon.addEventListener('click', (e) => {
        e.stopPropagation();
        parent.postMessage({ 
          pluginMessage: { 
            type: 'locate-frame', 
            nodeId: frameInfo.nodeId 
          } 
        }, '*');
      });

      header.appendChild(titleContainer);
      header.appendChild(actions);
      item.appendChild(header);
      item.appendChild(details);
      
      return item;
    }

    // Show analysis results
    function showAnalysisResults(results) {
      analysisData = results;
      
      if (results.removableFrames === 0) {
        showOptimizedScreen(results);
      } else {
        showNormalAnalysis(results);
      }
    }

    // Show normal analysis with removable frames
    function showNormalAnalysis(results) {
      // Update frame name
      document.getElementById('frame-name').textContent = results.frameName;
      
      // Update stats
      document.getElementById('total-frames').textContent = results.totalFrames;
      document.getElementById('removable-frames').textContent = results.removableFrames;
      
      // Show removable container
      document.getElementById('removable-container').style.display = 'block';
      
      // Populate removable list
      const list = document.getElementById('removable-list');
      list.innerHTML = '';
      
      results.removableFrameInfos.forEach((frameInfo, index) => {
        const item = createRemovableItem(frameInfo, index);
        list.appendChild(item);
      });
      
      // Update optimize button
      document.getElementById('optimize-btn').textContent = 'Optimize';
      document.getElementById('optimize-btn').style.display = 'block';
      
      showScreen('analysis');
    }

    // Show optimized screen
    function showOptimizedScreen(results) {
      // Update frame name
      document.getElementById('optimized-frame-name').textContent = results.frameName;
      
      // Update stats
      document.getElementById('optimized-total-frames').textContent = results.totalFrames;
      
      showScreen('optimized');
    }

    // Event listeners
    document.getElementById('optimize-btn').addEventListener('click', () => {
      parent.postMessage({ pluginMessage: { type: 'optimize' } }, '*');
    });

    document.getElementById('know-more').addEventListener('click', (e) => {
      e.preventDefault();
      alert('Learn more functionality coming soon!');
    });

    document.getElementById('report-bug').addEventListener('click', (e) => {
      e.preventDefault();
      alert('Bug reporting functionality coming soon!');
    });

    // Message handler from plugin
    window.onmessage = (event) => {
      const message = event.data.pluginMessage;
      
      if (message.type === 'selection-changed') {
        if (!message.hasSelection) {
          // Go back to initial screen when nothing is selected
          showScreen('initial');
          analysisData = null;
        }
      } else if (message.type === 'analysis-result') {
        if (message.hasSelection && message.results) {
          showAnalysisResults(message.results);
        }
      }
    };

    // Initialize
    showScreen('initial');
  </script>
</body>
</html>
