<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Frame Cleaner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            font-size: 12px;
            line-height: 1.4;
            color: #333;
            background: #fff;
            padding: 16px;
        }
        
        .header {
            margin-bottom: 16px;
        }
        
        .title {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 6px;
        }
        
        .subtitle {
            font-size: 11px;
            color: #666;
            line-height: 1.3;
        }
        
        .actions {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .btn {
            flex: 1;
            padding: 8px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fff;
            color: #333;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        
        .btn:hover {
            background: #f5f5f5;
            border-color: #ccc;
        }
        
        .btn.primary {
            background: #0066ff;
            border-color: #0066ff;
            color: #fff;
        }
        
        .btn.primary:hover {
            background: #0052cc;
            border-color: #0052cc;
        }
        
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #f5f5f5 !important;
            border-color: #e0e0e0 !important;
            color: #999 !important;
        }
        
        .btn.primary:disabled {
            background: #ccc !important;
            border-color: #ccc !important;
            color: #666 !important;
        }
        
        .results {
            display: none;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 12px;
        }
        
        .results.show {
            display: block;
        }
        
        .results-title {
            font-size: 13px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 8px;
        }
        
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-number {
            font-size: 18px;
            font-weight: 700;
            color: #0066ff;
            display: block;
        }
        
        .stat-label {
            font-size: 10px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }
        
        .summary {
            font-size: 11px;
            color: #555;
            padding-top: 8px;
            border-top: 1px solid #e9ecef;
        }
        
        .message {
            font-size: 11px;
            color: #666;
            text-align: center;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 6px;
            margin-top: 8px;
        }
        
        .loading {
            opacity: 0.6;
        }
        
        .success {
            color: #28a745;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">Frame Cleaner</div>
        <div class="subtitle">Optimize auto-layout structures by merging unnecessary nested frames</div>
    </div>
    
    <div class="actions">
        <button id="analyze-btn" class="btn">Analyze</button>
        <button id="clean-btn" class="btn primary">Clean</button>
    </div>
    
    <div id="results" class="results">
        <div class="results-title">Results</div>
        <div class="stat-grid">
            <div class="stat">
                <span id="total-frames" class="stat-number">0</span>
                <div class="stat-label">Total Frames</div>
            </div>
            <div class="stat">
                <span id="mergeable-frames" class="stat-number">0</span>
                <div class="stat-label">Mergeable</div>
            </div>
        </div>
        <div id="summary" class="summary"></div>
    </div>
    
    <div id="message" class="message" style="display: none;"></div>

    <script>
        const analyzeBtn = document.getElementById('analyze-btn');
        const cleanBtn = document.getElementById('clean-btn');
        const resultsDiv = document.getElementById('results');
        const messageDiv = document.getElementById('message');
        
        function showMessage(text, className = '') {
            messageDiv.textContent = text;
            messageDiv.className = `message ${className}`;
            messageDiv.style.display = 'block';
            resultsDiv.classList.remove('show');
        }
        
        function hideMessage() {
            messageDiv.style.display = 'none';
        }
        
        function setLoading(isLoading) {
            analyzeBtn.disabled = isLoading;
            cleanBtn.disabled = isLoading;
            if (isLoading) {
                document.body.classList.add('loading');
            } else {
                document.body.classList.remove('loading');
            }
        }
        
        // ✨ NEW: Update button states based on selection
        function updateButtonStates(hasSelection) {
            if (hasSelection) {
                analyzeBtn.disabled = false;
                cleanBtn.disabled = false;
                analyzeBtn.textContent = 'Analyze';
                cleanBtn.textContent = 'Clean';
            } else {
                analyzeBtn.disabled = true;
                cleanBtn.disabled = true;
                analyzeBtn.textContent = 'Select frames first';
                cleanBtn.textContent = 'Select frames first';
            }
        }
        
        function updateResults(data) {
            if (!data) return;
            
            document.getElementById('total-frames').textContent = data.totalFrames;
            document.getElementById('mergeable-frames').textContent = data.mergeableFrames;
            
            let summaryText = '';
            if (data.mergeableFrames === 0) {
                summaryText = 'No optimization opportunities found.';
            } else if (data.mergeableFrames === 1) {
                summaryText = '1 frame can be optimized.';
            } else {
                summaryText = `${data.mergeableFrames} frames can be optimized.`;
            }
            
            if (data.paddingOptimizations > 0) {
                summaryText += ` ${data.paddingOptimizations} padding optimizations available.`;
            }
            
            document.getElementById('summary').textContent = summaryText;
            
            hideMessage();
            resultsDiv.classList.add('show');
        }
        
        function updateCleaningResults(data) {
            if (!data) return;
            
            // Handle no selection case
            if (data.message) {
                showMessage(data.message);
                return;
            }
            
            let summaryText = '';
            if (data.framesMerged === 0) {
                summaryText = 'No frames were merged.';
            } else if (data.framesMerged === 1) {
                summaryText = '1 frame was merged and optimized.';
            } else {
                summaryText = `${data.framesMerged} frames were merged and optimized.`;
            }
            
            showMessage(summaryText, 'success');
        }
        
        analyzeBtn.addEventListener('click', () => {
            if (analyzeBtn.disabled) return; // Prevent action if disabled
            setLoading(true);
            showMessage('Analyzing selection...');
            parent.postMessage({ pluginMessage: { type: 'analyze-selection' } }, '*');
        });
        
        cleanBtn.addEventListener('click', () => {
            if (cleanBtn.disabled) return; // Prevent action if disabled
            setLoading(true);
            showMessage('Cleaning selection...');
            parent.postMessage({ pluginMessage: { type: 'clean-selection' } }, '*');
        });
        
        window.addEventListener('message', (event) => {
            const msg = event.data.pluginMessage;
            
            // ✨ NEW: Handle selection changes
            if (msg.type === 'selection-changed') {
                updateButtonStates(msg.hasSelection);
                if (!msg.hasSelection) {
                    // Clear any existing results when selection is lost
                    hideMessage();
                    resultsDiv.classList.remove('show');
                }
                return;
            }
            
            setLoading(false);
            
            if (msg.type === 'analysis-result') {
                if (msg.results) {
                    updateResults(msg.results);
                } else {
                    showMessage(msg.message);
                }
            } else if (msg.type === 'cleaning-result') {
                updateCleaningResults(msg.results);
            }
        });
    </script>
</body>
</html>
