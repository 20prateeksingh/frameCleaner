<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Frame Cleaner</title>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      margin: 0;
      padding: 16px;
      background: #ffffff;
      color: #000000;
    }
    
    .header {
      margin-bottom: 16px;
      text-align: center;
    }
    
    .title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    
    .subtitle {
      font-size: 11px;
      color: #666666;
      margin-bottom: 16px;
    }
    
    .section {
      margin-bottom: 16px;
    }
    
    .section-title {
      font-size: 11px;
      font-weight: 500;
      color: #333333;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .button-group {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    
    .button {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      background: #ffffff;
      color: #000000;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .button:hover {
      background: #f5f5f5;
      border-color: #d4d4d4;
    }
    
    .button.primary {
      background: #4F46E5;
      color: #ffffff;
      border-color: #4F46E5;
    }
    
    .button.primary:hover {
      background: #4338CA;
      border-color: #4338CA;
    }
    
    .button:disabled {
      background: #f5f5f5;
      color: #999999;
      border-color: #e5e5e5;
      cursor: not-allowed;
    }
    
    .results {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 12px;
      font-size: 11px;
      line-height: 1.4;
      margin-top: 12px;
    }
    
    .results.hidden {
      display: none;
    }
    
    .results-title {
      font-weight: 600;
      margin-bottom: 8px;
      color: #334155;
    }
    
    .results-item {
      margin-bottom: 4px;
      color: #475569;
    }
    
    .results-success {
      background: #f0fdf4;
      border-color: #bbf7d0;
      color: #166534;
    }
    
    .status {
      text-align: center;
      font-size: 11px;
      color: #666666;
      margin-top: 12px;
      padding: 8px;
      background: #f8fafc;
      border-radius: 4px;
    }
    
    .limitations {
      background: #fffbeb;
      border: 1px solid #fed7aa;
      border-radius: 6px;
      padding: 12px;
      margin-top: 16px;
    }
    
    .limitations-title {
      font-weight: 600;
      margin-bottom: 6px;
      color: #92400e;
      font-size: 11px;
    }
    
    .limitations-text {
      font-size: 10px;
      color: #a16207;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">Frame Cleaner</div>
    <div class="subtitle">Intelligent auto-layout optimization</div>
  </div>

  <div class="section">
    <div class="section-title">Analysis</div>
    <div class="button-group">
      <button id="analyze-selection" class="button">Analyze Selection</button>
      <button id="analyze-page" class="button">Analyze Page</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Optimization</div>
    <div class="button-group">
      <button id="clean-selection" class="button primary">Clean Selection</button>
      <button id="clean-page" class="button primary">Clean Page</button>
    </div>
  </div>

  <div id="results" class="results hidden">
    <div id="results-content"></div>
  </div>

  <div id="status" class="status">
    <span id="status-text">Select frames to get started</span>
  </div>

  <div class="limitations">
    <div class="limitations-title">V1 Safety Limitations</div>
    <div class="limitations-text">
      Blocks optimization for frames with: rotation/transforms, gradients, images, 
      prototype interactions, wrap mode, baseline alignment, or clipsContent masking.
    </div>
  </div>

  <script>
    // Button event listeners
    document.getElementById('analyze-selection').addEventListener('click', () => {
      parent.postMessage({ pluginMessage: { type: 'analyze-selection' } }, '*');
    });

    document.getElementById('analyze-page').addEventListener('click', () => {
      parent.postMessage({ pluginMessage: { type: 'analyze-page' } }, '*');
    });

    document.getElementById('clean-selection').addEventListener('click', () => {
      parent.postMessage({ pluginMessage: { type: 'clean-selection' } }, '*');
    });

    document.getElementById('clean-page').addEventListener('click', () => {
      parent.postMessage({ pluginMessage: { type: 'clean-page' } }, '*');
    });

    // Message handler from plugin
    window.onmessage = (event) => {
      const message = event.data.pluginMessage;
      
      if (message.type === 'selection-changed') {
        updateSelectionStatus(message.hasSelection, message.selectionCount);
      } else if (message.type === 'analysis-result') {
        showAnalysisResults(message.results);
      } else if (message.type === 'cleaning-result') {
        showCleaningResults(message.results);
      }
    };

    function updateSelectionStatus(hasSelection, count) {
      const statusText = document.getElementById('status-text');
      const analyzeSelectionBtn = document.getElementById('analyze-selection');
      const cleanSelectionBtn = document.getElementById('clean-selection');
      
      if (hasSelection) {
        statusText.textContent = `${count} frame${count !== 1 ? 's' : ''} selected`;
        analyzeSelectionBtn.disabled = false;
        cleanSelectionBtn.disabled = false;
      } else {
        statusText.textContent = 'Select frames to get started';
        analyzeSelectionBtn.disabled = true;
        cleanSelectionBtn.disabled = true;
      }
    }

    function showAnalysisResults(results) {
      const resultsDiv = document.getElementById('results');
      const resultsContent = document.getElementById('results-content');
      
      if (!results) {
        resultsDiv.className = 'results hidden';
        return;
      }
      
      resultsDiv.className = 'results';
      resultsContent.innerHTML = `
        <div class="results-title">Analysis Results</div>
        <div class="results-item">Total Frames: ${results.totalFrames}</div>
        <div class="results-item">Mergeable: ${results.mergeableFrames}</div>
        <div class="results-item">Optimizable Sibling Groups: ${results.optimizableSiblingGroups}</div>
        <div class="results-item">Padding Optimizations: ${results.paddingOptimizations}</div>
        ${results.issues.length > 0 ? `<div class="results-item">Issues Found: ${results.issues.length}</div>` : ''}
      `;
    }

    function showCleaningResults(results) {
      const resultsDiv = document.getElementById('results');
      const resultsContent = document.getElementById('results-content');
      
      if (results.message) {
        resultsDiv.className = 'results';
        resultsContent.innerHTML = `<div class="results-title">${results.message}</div>`;
        return;
      }
      
      const totalOptimized = results.framesMerged + results.siblingGroupsOptimized;
      
      resultsDiv.className = 'results results-success';
      resultsContent.innerHTML = `
        <div class="results-title">Optimization Complete! ✅</div>
        <div class="results-item">Frames Analyzed: ${results.framesAnalyzed}</div>
        <div class="results-item">Parent-Child Merges: ${results.framesMerged}</div>
        <div class="results-item">Sibling Groups Optimized: ${results.siblingGroupsOptimized}</div>
        <div class="results-item">Total Frames Removed: ${results.siblingsRemoved}</div>
        <div class="results-item"><strong>Total Optimized: ${totalOptimized} structures</strong></div>
      `;
    }

    // Initialize button states
    updateSelectionStatus(false, 0);
  </script>
</body>
</html>
