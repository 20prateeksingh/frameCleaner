<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Frame Cleaner</title>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      margin: 0;
      padding: 16px;
      background: #ffffff;
      color: #000000;
      overflow: hidden;
    }
    
    .screen {
      display: none;
      animation: fadeIn 0.3s ease-in;
    }
    
    .screen.active {
      display: block;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    /* Common Elements */
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    
    .logo {
      width: 40px;
      height: 40px;
      background: #4F46E5;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 20px;
      font-weight: 700;
      color: white;
    }
    
    .value-prop {
      font-size: 14px;
      color: #333333;
      line-height: 1.4;
      margin-bottom: 24px;
    }
    
    /* Buttons */
    .button {
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      border: none;
      width: 100%;
      margin-bottom: 8px;
    }
    
    .button.primary {
      background: #4F46E5;
      color: #ffffff;
    }
    
    .button.primary:hover:not(:disabled) {
      background: #4338CA;
    }
    
    .button.secondary {
      background: #ffffff;
      color: #4F46E5;
      border: 2px solid #4F46E5;
    }
    
    .button.secondary:hover:not(:disabled) {
      background: #f8fafc;
    }
    
    .button:disabled {
      background: #f5f5f5;
      color: #999999;
      border-color: #e5e5e5;
      cursor: not-allowed;
    }
    
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 24px;
    }
    
    /* Ready Screen */
    .helper-text {
      font-size: 11px;
      color: #666666;
      text-align: center;
      margin-bottom: 32px;
    }
    
    .tertiary-links {
      text-align: center;
      margin-top: 32px;
    }
    
    .link {
      color: #4F46E5;
      text-decoration: none;
      font-size: 11px;
      display: block;
      margin-bottom: 12px;
      cursor: pointer;
    }
    
    .link:hover {
      text-decoration: underline;
    }
    
    /* Analysis Screen */
    .back-button {
      position: absolute;
      top: 16px;
      left: 16px;
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #666666;
      padding: 4px;
    }
    
    .back-button:hover {
      color: #333333;
    }
    
    .analysis-summary {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }
    
    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .slider-container {
      margin-bottom: 16px;
    }
    
    .slider-label {
      font-size: 11px;
      color: #475569;
      margin-bottom: 8px;
    }
    
    .slider-track {
      width: 100%;
      height: 8px;
      background: linear-gradient(to right, #10b981 0%, #f59e0b 50%, #ef4444 100%);
      border-radius: 4px;
      position: relative;
      margin-bottom: 8px;
    }
    
    .slider-thumb {
      width: 16px;
      height: 16px;
      background: #ffffff;
      border: 2px solid #333333;
      border-radius: 50%;
      position: absolute;
      top: -4px;
      transition: left 1.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .slider-status {
      font-size: 11px;
      font-weight: 500;
      color: #334155;
    }
    
    .layer-info {
      margin-top: 16px;
    }
    
    .layer-stat {
      font-size: 11px;
      color: #475569;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .expandable-trigger {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 11px;
      color: #4F46E5;
      padding: 0;
    }
    
    .removable-list {
      max-height: 120px;
      overflow-y: auto;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      margin-top: 8px;
    }
    
    .removable-item {
      padding: 8px 12px;
      font-size: 11px;
      color: #334155;
      border-bottom: 1px solid #f1f5f9;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    
    .removable-item:last-child {
      border-bottom: none;
    }
    
    .removable-item:hover {
      background: #f8fafc;
    }
    
    .removable-item::before {
      content: "•";
      color: #4F46E5;
      margin-right: 8px;
    }
    
    /* Results Screen */
    .celebration {
      text-align: center;
      margin: 32px 0;
    }
    
    .frames-removed {
      font-size: 24px;
      font-weight: 700;
      color: #059669;
      margin-bottom: 8px;
    }
    
    .celebration-text {
      font-size: 12px;
      color: #334155;
    }
    
    .results-slider {
      margin: 32px 0;
    }
    
    /* Fully Optimized */
    .optimized-message {
      text-align: center;
      font-size: 14px;
      color: #059669;
      margin: 24px 0;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <!-- Ready Screen -->
  <div id="ready-screen" class="screen active">
    <div class="header">
      <div class="logo">F</div>
      <div class="value-prop">Intelligent auto-layout optimization</div>
    </div>

    <div class="button-group">
      <button id="analyze-btn" class="button primary" disabled>Analyse</button>
      <button id="quick-clean-btn" class="button secondary" disabled>Quick Clean</button>
    </div>

    <div class="helper-text">Select a Frame to get started</div>

    <div class="tertiary-links">
      <a href="#" class="link" id="learn-more">Know more</a>
      <a href="#" class="link" id="report-bug">Found a bug? Report</a>
    </div>
  </div>

  <!-- Analysis Screen -->
  <div id="analysis-screen" class="screen">
    <button class="back-button" id="back-btn">←</button>
    
    <div class="header">
      <div class="logo">F</div>
    </div>

    <div class="analysis-summary">
      <div class="section-title">Analysis Summary</div>
      
      <div class="slider-container">
        <div class="slider-label">Layer Structure</div>
        <div class="slider-track">
          <div class="slider-thumb" id="analysis-thumb"></div>
        </div>
        <div class="slider-status" id="slider-status">Well optimized</div>
      </div>

      <button id="optimize-btn" class="button primary">Optimize</button>

      <div class="layer-info">
        <div class="layer-stat">
          <span>Total Layers: <span id="total-layers">0</span></span>
        </div>
        <div class="layer-stat" id="removable-section">
          <span>Removable Layers: <span id="removable-count">0</span></span>
          <button class="expandable-trigger" id="expand-toggle">⌄</button>
        </div>
        <div id="removable-list" class="removable-list" style="display: none;"></div>
      </div>
    </div>
  </div>

  <!-- Results Screen -->
  <div id="results-screen" class="screen">
    <div class="header">
      <div class="logo">F</div>
    </div>

    <div class="celebration">
      <div class="frames-removed" id="frames-removed-count">12 frames removed</div>
    </div>

    <div class="results-slider">
      <div class="slider-label">Layer Structure</div>
      <div class="slider-track">
        <div class="slider-thumb" id="results-thumb"></div>
      </div>
      <div class="slider-status">Well optimized</div>
    </div>

    <button id="done-btn" class="button primary">Done</button>
  </div>

  <script>
    // State management
    let currentScreen = 'ready';
    let analysisData = null;
    let hasSelection = false;

    // Screen management
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(screen => {
        screen.classList.remove('active');
      });
      document.getElementById(screenId + '-screen').classList.add('active');
      currentScreen = screenId;
    }

    // Calculate slider position (0-100%)
    function calculateSliderPosition(percentage) {
      return Math.min(100, Math.max(0, percentage * 100));
    }

    // Update slider visual state
    function updateSlider(thumbElement, percentage) {
      const position = calculateSliderPosition(percentage);
      thumbElement.style.left = `calc(${position}% - 8px)`;
    }

    // Get status text based on percentage
    function getStatusText(percentage) {
      if (percentage <= 0.1) return 'Well optimized';
      return 'Optimization needed';
    }

    // Update selection state
    function updateSelectionState(hasSelection, count) {
      const analyzeBtn = document.getElementById('analyze-btn');
      const quickCleanBtn = document.getElementById('quick-clean-btn');
      const helperText = document.querySelector('.helper-text');
      
      if (hasSelection) {
        analyzeBtn.disabled = false;
        quickCleanBtn.disabled = false;
        helperText.textContent = `${count} frame${count !== 1 ? 's' : ''} selected`;
      } else {
        analyzeBtn.disabled = true;
        quickCleanBtn.disabled = true;
        helperText.textContent = 'Select a Frame to get started';
      }
    }

    // Show analysis results
    function showAnalysisResults(results) {
      analysisData = results;
      
      if (results.removableFrames === 0) {
        showFullyOptimizedAnalysis(results);
      } else {
        showNormalAnalysis(results);
      }
      
      showScreen('analysis');
    }

    function showNormalAnalysis(results) {
      const percentage = results.removableFrames / results.totalFrames;
      
      // Update slider
      const thumb = document.getElementById('analysis-thumb');
      updateSlider(thumb, percentage);
      
      // Update status
      document.getElementById('slider-status').textContent = getStatusText(percentage);
      
      // Update layer counts
      document.getElementById('total-layers').textContent = results.totalFrames;
      document.getElementById('removable-count').textContent = results.removableFrames;
      
      // Show removable section
      document.getElementById('removable-section').style.display = 'flex';
      
      // Populate removable list
      const list = document.getElementById('removable-list');
      list.innerHTML = '';
      results.removableFrameNames.forEach(name => {
        const item = document.createElement('div');
        item.className = 'removable-item';
        item.textContent = name;
        list.appendChild(item);
      });
      
      // Update optimize button
      document.getElementById('optimize-btn').textContent = 'Optimize';
    }

    function showFullyOptimizedAnalysis(results) {
      const thumb = document.getElementById('analysis-thumb');
      updateSlider(thumb, 0);
      
      document.getElementById('slider-status').textContent = 'Well optimized';
      document.getElementById('total-layers').textContent = results.totalFrames;
      
      // Hide removable section
      document.getElementById('removable-section').style.display = 'none';
      
      // Add optimized message
      const layerInfo = document.querySelector('.layer-info');
      if (!document.querySelector('.optimized-message')) {
        const message = document.createElement('div');
        message.className = 'optimized-message';
        message.textContent = 'Your layers are fully optimized!';
        layerInfo.appendChild(message);
      }
      
      // Update button
      document.getElementById('optimize-btn').textContent = 'Done';
    }

    // Show cleaning results
    function showCleaningResults(results) {
      if (results.message) {
        // Handle error case
        alert(results.message);
        return;
      }

      const framesRemoved = results.siblingsRemoved;
      document.getElementById('frames-removed-count').textContent = 
        `${framesRemoved} frame${framesRemoved !== 1 ? 's' : ''} removed`;
      
      // Animate slider to green
      const resultsThumb = document.getElementById('results-thumb');
      // Start from previous position if we have analysis data
      if (analysisData) {
        const startPercentage = analysisData.removableFrames / analysisData.totalFrames;
        updateSlider(resultsThumb, startPercentage);
        
        // Animate to green after a brief delay
        setTimeout(() => {
          updateSlider(resultsThumb, 0);
        }, 500);
      } else {
        updateSlider(resultsThumb, 0);
      }
      
      showScreen('results');
    }

    // Event listeners
    document.getElementById('analyze-btn').addEventListener('click', () => {
      parent.postMessage({ pluginMessage: { type: 'analyze-selection' } }, '*');
    });

    document.getElementById('quick-clean-btn').addEventListener('click', () => {
      parent.postMessage({ pluginMessage: { type: 'clean-selection' } }, '*');
    });

    document.getElementById('optimize-btn').addEventListener('click', () => {
      if (analysisData && analysisData.removableFrames === 0) {
        // Fully optimized, go back to ready
        showScreen('ready');
      } else {
        // Run optimization
        parent.postMessage({ pluginMessage: { type: 'clean-selection' } }, '*');
      }
    });

    document.getElementById('back-btn').addEventListener('click', () => {
      showScreen('ready');
    });

    document.getElementById('done-btn').addEventListener('click', () => {
      showScreen('ready');
    });

    document.getElementById('expand-toggle').addEventListener('click', () => {
      const list = document.getElementById('removable-list');
      const toggle = document.getElementById('expand-toggle');
      
      if (list.style.display === 'none') {
        list.style.display = 'block';
        toggle.textContent = '⌃';
      } else {
        list.style.display = 'none';
        toggle.textContent = '⌄';
      }
    });

    // Placeholder for tertiary links
    document.getElementById('learn-more').addEventListener('click', (e) => {
      e.preventDefault();
      alert('Learn more functionality coming soon!');
    });

    document.getElementById('report-bug').addEventListener('click', (e) => {
      e.preventDefault();
      alert('Bug reporting functionality coming soon!');
    });

    // Message handler from plugin
    window.onmessage = (event) => {
      const message = event.data.pluginMessage;
      
      if (message.type === 'selection-changed') {
        hasSelection = message.hasSelection;
        updateSelectionState(message.hasSelection, message.selectionCount);
      } else if (message.type === 'analysis-result') {
        showAnalysisResults(message.results);
      } else if (message.type === 'cleaning-result') {
        showCleaningResults(message.results);
      }
    };

    // Initialize
    updateSelectionState(false, 0);
  </script>
</body>
</html>
